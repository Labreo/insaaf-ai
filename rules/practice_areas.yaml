# Practice-area registry. Single source of truth for case types across backend + frontend (/v1/meta).
# limitation.years: null => no fixed civil limitation clock (explained by limitation.note).
# ml_slots: proof-ledger requirement substrings feeding the 5 evidentiary features of the B-score model,
#           in order [registered_deed_present, stamp_duty_paid, possession_evidence, revenue_record_form_1_14, payment_trail].
areas:
  property:
    label: Civil — Property & Title
    tag: PROP
    group: Civil
    forum: Civil Judge Senior Division
    limitation: {article: "Limitation Act, 1963 — Art. 65 (possession based on title)", years: 12, note: ""}
    commercial_court: false
    adr_routes: ["s.89 CPC", "Lok Adalat"]
    instruments: [legal_notice, plaint, written_statement]
    statutes: ["Transfer of Property Act, 1882", "Registration Act, 1908 s.17", "Specific Relief Act, 1963"]
    search_seed: "unregistered agreement of sale possession title registration section 17"
    ml_slots: ["registered sale deed", "stamp duty", "possession", "form i", "payment trail"]

  civil_recovery:
    label: Civil — Money Recovery
    tag: CIV
    group: Civil
    forum: Civil Judge Senior Division
    limitation: {article: "Limitation Act, 1963 — Art. 14 / 18 / 19 (3 years)", years: 3, note: ""}
    commercial_court: false
    adr_routes: ["s.89 CPC", "Lok Adalat"]
    instruments: [legal_notice, plaint, summary_suit]
    statutes: ["Code of Civil Procedure, 1908 Order XXXVII", "Indian Contract Act, 1872"]
    search_seed: "money recovery suit invoices part payment acknowledgment limitation section 18"
    ml_slots: ["tax invoices", "written contract", "mediation", "statement of account", "part-payment"]

  commercial:
    label: Commercial Dispute
    tag: COMM
    group: Commercial
    forum: Commercial Court (District level)
    limitation: {article: "Limitation Act, 1963 — Art. 55 (breach of contract, 3 years)", years: 3, note: ""}
    commercial_court: true
    adr_routes: ["Pre-institution mediation (s.12A)", "Arbitration (if clause)", "Lok Adalat"]
    instruments: [legal_notice, commercial_plaint, written_statement]
    statutes: ["Commercial Courts Act, 2015 s.12A", "Indian Contract Act, 1872 s.73"]
    search_seed: "commercial suit section 12A pre-institution mediation mandatory breach of contract damages"
    ml_slots: ["written contract", "tax invoices", "mediation", "correspondence", "part-payment"]

  cheque_bounce:
    label: Cheque Dishonour (NI Act s.138)
    tag: S138
    group: Commercial
    forum: Judicial Magistrate First Class
    limitation: {article: "NI Act s.138(b)/(c), s.142 — notice within 30 days of memo; complaint within 1 month of cause", years: null, note: "Statutory clock runs in days: demand notice within 30 days of the bank's return memo, 15 days for payment, complaint within 30 days thereafter (s.142(1)(b)). Delay is condonable on sufficient cause."}
    commercial_court: false
    adr_routes: ["Compounding (s.147 NI Act)", "Lok Adalat", "Mediation"]
    instruments: [s138_notice, s138_complaint]
    statutes: ["Negotiable Instruments Act, 1881 ss.138, 139, 142, 143A, 147"]
    search_seed: "section 138 negotiable instruments act dishonour cheque legally enforceable debt presumption section 139"
    ml_slots: ["dishonour memo", "demand notice", "legally enforceable debt", "complaint within time", "postal proof"]

  consumer:
    label: Consumer Complaint
    tag: CONS
    group: Consumer
    forum: District Consumer Disputes Redressal Commission
    limitation: {article: "Consumer Protection Act, 2019 — s.69 (2 years)", years: 2, note: ""}
    commercial_court: false
    adr_routes: ["Consumer mediation cell (s.74)", "Lok Adalat"]
    instruments: [legal_notice, consumer_complaint]
    statutes: ["Consumer Protection Act, 2019 ss.2(11), 2(47), 35, 69"]
    search_seed: "deficiency in service consumer protection act 2019 compensation unfair trade practice"
    ml_slots: ["purchase invoice", "deficiency evidence", "complaint to seller", "warranty", "payment proof"]

  rent_tenancy:
    label: Rent & Tenancy / Eviction
    tag: RENT
    group: Civil
    forum: Rent Controller
    limitation: {article: "Limitation Act, 1963 — Art. 67 (12 years from tenancy determination); arrears Art. 52 (3 years)", years: 3, note: "Clock shown is for arrears of rent; eviction on determination of tenancy runs 12 years."}
    commercial_court: false
    adr_routes: ["Lok Adalat", "s.89 CPC"]
    instruments: [legal_notice, eviction_petition]
    statutes: ["Goa, Daman and Diu Buildings (Lease, Rent and Eviction) Control Act, 1968", "Transfer of Property Act, 1882 s.106"]
    search_seed: "eviction bona fide requirement landlord tenant arrears of rent rent controller"
    ml_slots: ["rent agreement", "notice to quit", "arrears", "bona fide requirement", "rent receipts"]

  family_matrimonial:
    label: Family — Matrimonial
    tag: FAM
    group: Family
    forum: Family Court
    limitation: {article: "No general limitation for divorce; HMA s.13(1A) — 1 year after decree of judicial separation", years: null, note: "Matrimonial reliefs are not barred by a fixed limitation period; statutory waiting periods (e.g. s.13B 6-month cooling period, waivable per Amardeep Singh) apply instead."}
    commercial_court: false
    adr_routes: ["Court-annexed mediation", "Family counselling"]
    instruments: [legal_notice, divorce_petition]
    statutes: ["Hindu Marriage Act, 1955 ss.13, 13B", "Special Marriage Act, 1954", "Family Courts Act, 1984"]
    search_seed: "mutual consent divorce section 13B cooling period waiver cruelty desertion"
    ml_slots: ["marriage certificate", "separation evidence", "cruelty", "mediation", "income proof"]

  maintenance:
    label: Family — Maintenance
    tag: MAIN
    group: Family
    forum: Family Court / JMFC
    limitation: {article: "BNSS s.144 (old CrPC s.125) — arrears recoverable within 1 year of falling due (s.147(3))", years: 1, note: "The right to claim maintenance is continuing; only recovery of arrears is limited to 1 year."}
    commercial_court: false
    adr_routes: ["Court-annexed mediation", "Family counselling"]
    instruments: [legal_notice, maintenance_petition]
    statutes: ["BNSS, 2023 s.144 (CrPC s.125)", "Hindu Adoptions and Maintenance Act, 1956 s.18", "Protection of Women from Domestic Violence Act, 2005"]
    search_seed: "maintenance section 125 crpc 144 bnss wife unable to maintain herself income affidavit rajnesh"
    ml_slots: ["marriage proof", "neglect or refusal", "income of respondent", "income and asset affidavit", "expenses proof"]

  motor_accident:
    label: Motor Accident Claim (MACT)
    tag: MACT
    group: Tort
    forum: Motor Accident Claims Tribunal
    limitation: {article: "Motor Vehicles Act, 1988 — s.166(3) (6 months from accident, as amended 2019)", years: null, note: "Claims must be filed within 6 months of the accident (s.166(3) as amended). Tribunals have treated the bar as directory in hardship cases; verify current position."}
    commercial_court: false
    adr_routes: ["Lok Adalat (MACT)", "Insurer settlement (s.149)"]
    instruments: [legal_notice, mact_claim]
    statutes: ["Motor Vehicles Act, 1988 ss.140, 163A, 166"]
    search_seed: "motor accident compensation multiplier sarla verma pranay sethi future prospects dependency"
    ml_slots: ["fir", "medical records", "income proof", "insurance policy", "post-mortem or disability"]

  labour:
    label: Labour & Employment
    tag: LAB
    group: Labour
    forum: Labour Court / Industrial Tribunal
    limitation: {article: "Industrial Disputes Act s.2A(3) — 3 years for individual dispute on discharge/dismissal", years: 3, note: ""}
    commercial_court: false
    adr_routes: ["Conciliation (s.12 ID Act)", "Lok Adalat"]
    instruments: [legal_notice, labour_claim]
    statutes: ["Industrial Disputes Act, 1947 ss.2A, 25F", "Code on Wages, 2019", "Payment of Gratuity Act, 1972"]
    search_seed: "illegal termination section 25F retrenchment compensation reinstatement back wages workman"
    ml_slots: ["appointment letter", "termination order", "continuous service", "salary slips", "conciliation"]

  writ_service:
    label: Writ & Service Matters
    tag: WRIT
    group: Constitutional
    forum: High Court (Art. 226)
    limitation: {article: "No statutory limitation; delay and laches doctrine applies", years: null, note: "Writ courts refuse relief for unexplained delay; there is no fixed period. Service disputes may lie first before a Tribunal (CAT/SAT)."}
    commercial_court: false
    adr_routes: ["Representation to authority", "Departmental appeal"]
    instruments: [legal_notice, writ_petition]
    statutes: ["Constitution of India Arts. 14, 16, 226", "Administrative Tribunals Act, 1985"]
    search_seed: "writ petition article 226 arbitrary action natural justice service promotion seniority"
    ml_slots: ["impugned order", "representation made", "service record", "rule or policy", "comparator"]

  criminal:
    label: Criminal — Plea & Bail
    tag: CRIM
    group: Criminal
    forum: Judicial Magistrate First Class
    limitation: {article: "BNSS s.514 (CrPC s.468) — bar on cognizance only for offences punishable up to 3 years", years: null, note: "Limitation for cognizance applies only to offences punishable with fine or up to 3 years (6 months / 1 yr / 3 yrs). Serious offences have no bar."}
    commercial_court: false
    adr_routes: ["Plea bargaining (BNSS s.289)", "Compounding (BNSS s.359)"]
    instruments: [plea_application, bail_application]
    statutes: ["Bharatiya Nagarik Suraksha Sanhita, 2023", "Bharatiya Nyaya Sanhita, 2023"]
    search_seed: "bail parity custody period triple test plea bargaining eligibility seven years"
    ml_slots: ["punishment", "not socio", "fir", "chargesheet", "no prior"]

  arbitration:
    label: Arbitration
    tag: ARB
    group: Commercial
    forum: High Court / Commercial Court (ss.9, 11, 34)
    limitation: {article: "Arbitration Act s.43 + Limitation Act Art. 137 (3 years for s.11); s.34 — 3 months + 30 days", years: 3, note: ""}
    commercial_court: true
    adr_routes: ["Arbitral tribunal", "Mediation"]
    instruments: [legal_notice, s11_application]
    statutes: ["Arbitration and Conciliation Act, 1996 ss.8, 9, 11, 34"]
    search_seed: "section 11 appointment of arbitrator arbitration clause existence prima facie section 34 patent illegality"
    ml_slots: ["arbitration clause", "notice invoking arbitration", "contract", "claim quantification", "correspondence"]

  succession_probate:
    label: Succession & Probate
    tag: SUCC
    group: Family
    forum: District Court (Probate)
    limitation: {article: "Limitation Act Art. 137 (3 years from when right to apply accrues; continuing per Kunvarjeet Singh)", years: 3, note: ""}
    commercial_court: false
    adr_routes: ["Family settlement", "Mediation"]
    instruments: [legal_notice, probate_petition]
    statutes: ["Indian Succession Act, 1925", "Hindu Succession Act, 1956 s.6", "Goa Succession, Special Notaries and Inventory Proceeding Act, 2012"]
    search_seed: "probate will suspicious circumstances attesting witness section 63 succession coparcenary daughter"
    ml_slots: ["death certificate", "will or family tree", "attesting witness", "property records", "no-objection"]

  intellectual_property:
    label: Intellectual Property
    tag: IP
    group: Commercial
    forum: Commercial Court / High Court (IP Division)
    limitation: {article: "Limitation Act Art. 88 (3 years) — continuing infringement gives fresh cause", years: 3, note: ""}
    commercial_court: true
    adr_routes: ["Pre-institution mediation (s.12A)", "Cease-and-desist settlement"]
    instruments: [legal_notice, ip_plaint]
    statutes: ["Trade Marks Act, 1999 ss.29, 134", "Copyright Act, 1957 s.62"]
    search_seed: "trademark infringement passing off deceptive similarity prior user interim injunction"
    ml_slots: ["registration certificate", "prior use evidence", "infringing material", "sales figures", "cease and desist"]

